version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: chatbit-db
    environment:
      POSTGRES_USER: chatbit_user
      POSTGRES_PASSWORD: chatbit_pass
      POSTGRES_DB: chatbit_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbit_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbit-network


volumes:
  postgres-data:

networks:
  chatbit-network:
    driver: bridge